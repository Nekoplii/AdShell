name: Build and Release APK

on:
  push:
    tags:
      - 'v*' # Triggers when a tag starting with 'v' is pushed (e.g., v1.0.0)

permissions:
  contents: write # Required for creating GitHub Releases and uploading assets

jobs:
  build:
    name: Build & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Get Dependencies
        run: flutter pub get

      - name: Extract Version Name
        id: extract_version
        run: |
          # Remove the 'v' prefix from the tag (e.g., v1.0.0 -> 1.0.0)
          TAG_NAME=${{ github.ref_name }}
          VERSION_NAME=${TAG_NAME#v}
          echo "VERSION_NAME=$VERSION_NAME" >> $GITHUB_OUTPUT

      - name: Decode Keystore
        run: |
          # Strip headers, whitespace, and newlines before decoding to prevent JKS corruption
          echo "${{ secrets.KEYSTORE_BASE64 }}" | grep -v "CERTIFICATE" | tr -d '\n\r ' | base64 -d > android/app/release.jks

      - name: Build APK
        # Inject the tag as the version name and the GitHub run number as the version code
        run: flutter build apk --release --build-name=${{ steps.extract_version.outputs.VERSION_NAME }} --build-number=${{ github.run_number }}
        env:
          KEYSTORE_FILE: "release.jks"
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Rename APK
        run: mv build/app/outputs/flutter-apk/app-release.apk adshell-${{ github.ref_name }}.apk

      - name: Create Release and Upload APK
        uses: softprops/action-gh-release@v2
        with:
          files: adshell-${{ github.ref_name }}.apk
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
